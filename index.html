<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark" || savedTheme === "light") {
                document.documentElement.classList.add(savedTheme);
                document.documentElement.style.colorScheme = savedTheme;
            }
        </script>
        <title>Drop Share</title>
        <meta
            name="description"
            content="Share files easily and securely with Drop Share."
        />

        <link rel="canonical" href="https://artifacts.msar.dev/" />

        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://artifacts.msar.dev/" />
        <meta
            property="og:image"
            content="https://artifacts.msar.dev/og-image.png"
        />
        <meta property="og:title" content="Drop Share" />

            property="og:description"

        <meta
            name="twitter:description"
            content="Share files easily and securely with Drop Share."
        />
